<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDG Color Palette</title>
  <link rel="icon" type="image/svg+xml" href="./icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background-color: #1E1F21;
      overflow: hidden;
    }

    .bar-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .code-symbol {
      position: absolute;
      opacity: 0.08;
      animation: floatSymbol 15s infinite linear;
      font-family: 'DM Mono', monospace;
      font-size: 1.1rem;
      color: #fff;
    }

    @keyframes floatSymbol {
      from { transform: translateY(110vh) rotate(0deg); }
      to   { transform: translateY(-20vh) rotate(360deg); }
    }

    /* ── Layout ── */
    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Top bar ── */
    .bar-top {
      height: 220px;
      flex-shrink: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .bar-top img {
      height: 160px;
      width: auto;
      position: relative;
      z-index: 1;
    }

    /* ── Palette ── */
    .palette {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .col {
      flex: 1;
      position: relative;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 2rem;
      transition: flex 0.25s cubic-bezier(.4,0,.2,1);
      overflow: hidden;
    }

    .col:hover { flex: 1.7; }

    .col-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .col:hover .col-label {
      opacity: 1;
      transform: translateY(0);
    }

    .col-hex {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .col-name {
      font-size: 0.62rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      opacity: 0.7;
    }

    .col-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      transition: background 0.15s;
    }

    .col:hover .col-icon { background: rgba(255,255,255,0.15); }

    .col-icon svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Bottom bar ── */
    .bar-bottom {
      height: 80px;
      flex-shrink: 0;
      background: transparent;
      position: relative;
      overflow: hidden;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(255,255,255,0.92);
      color: #1a1a1a;
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      padding: 8px 20px;
      border-radius: 100px;
      opacity: 0;
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
      letter-spacing: 0.04em;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .col.flash::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.28);
      animation: flashOut 0.4s ease forwards;
      pointer-events: none;
    }

    @keyframes flashOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* ── Party mode (Konami) ── */
    body.party .code-symbol {
      animation-duration: 4s !important;
      opacity: 0.28 !important;
    }

    body.party .col::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      animation: partyOverlay 1s infinite linear;
    }

    body.party .col:nth-child(4n+1)::before { animation-delay: 0s; }
    body.party .col:nth-child(4n+2)::before { animation-delay: -0.25s; }
    body.party .col:nth-child(4n+3)::before { animation-delay: -0.5s; }
    body.party .col:nth-child(4n+4)::before { animation-delay: -0.75s; }

    @keyframes partyOverlay {
      0%   { background: rgba(66,133,244,0.22); }
      25%  { background: rgba(231,70,57,0.22); }
      50%  { background: rgba(251,188,4,0.22); }
      75%  { background: rgba(52,168,83,0.22); }
      100% { background: rgba(66,133,244,0.22); }
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; }
      .palette {
        flex-direction: column;
        flex: none;
      }
      .col {
        flex: none;
        height: 68px;
        flex-direction: row;
        justify-content: flex-start;
        align-items: center;
        padding: 0 1.25rem;
        gap: 12px;
      }
      .col:hover { flex: none; height: 68px; }
      .col-label {
        opacity: 1;
        transform: none;
        flex-direction: row;
        gap: 10px;
        align-items: center;
      }
      .col-icon { display: none; }
      .col-hex { font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="bar-top">
    <div class="bar-canvas" id="bg-canvas-top"></div>
    <img src="./logo.svg" alt="GDG Logo" />
  </div>

  <div class="palette" id="palette"></div>

  <div class="bar-bottom">
    <div class="bar-canvas" id="bg-canvas-bottom"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ============================================================
  //  KOLORY
  // ============================================================
  const colors = [
    { name: "Blue 700",   hex: "#2359C5" },
    { name: "Blue 500",   hex: "#4285F4" },
    { name: "Blue 300",   hex: "#57CBFF" },
    { name: "Blue 50",    hex: "#E2EFF3" },
    { name: "Red 700",    hex: "#C52A28" },
    { name: "Red 500",    hex: "#E74639" },
    { name: "Pink 300",   hex: "#FF7DB0" },
    { name: "Pink 50",    hex: "#F2E6E6" },
    { name: "Yellow 700", hex: "#E69100" },
    { name: "Yellow 500", hex: "#FBBC04" },
    { name: "Yellow 300", hex: "#FFD527" },
    { name: "Yellow 50",  hex: "#F2EFE0" },
    { name: "Green 700",  hex: "#25824B" },
    { name: "Green 500",  hex: "#34A853" },
    { name: "Green 300",  hex: "#5CDE6D" },
    { name: "Green 50",   hex: "#EAF1EA" },
    { name: "Gray 900",   hex: "#3A3F43" },
    { name: "Gray 700",   hex: "#5F6468" },
    { name: "Gray 500",   hex: "#807F85" },
    { name: "Gray 200",   hex: "#E8EAED" },
    { name: "White",      hex: "#FFFFFF" },
  ];
  // ============================================================

  function textColor(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.55 ? 'rgba(0,0,0,0.72)' : 'rgba(255,255,255,0.92)';
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  const palette = document.getElementById('palette');

  colors.forEach(color => {
    const tc = textColor(color.hex);
    const col = document.createElement('div');
    col.className = 'col';
    col.style.background = color.hex;
    col.style.color = tc;
    col.innerHTML = `
      <div class="col-label">
        <div class="col-icon">
          <svg viewBox="0 0 24 24" style="stroke:${tc}">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </div>
        <div class="col-hex">${color.hex.replace('#','')}</div>
        <div class="col-name">${color.name}</div>
      </div>`;

    col.addEventListener('click', () => {
      copyText(color.hex).then(() => {
        showToast('Skopiowano ' + color.hex.toUpperCase());
        col.classList.remove('flash');
        void col.offsetWidth;
        col.classList.add('flash');
        setTimeout(() => col.classList.remove('flash'), 400);
      });
    });

    palette.appendChild(col);
  });

  const bgColors = ['#4285F4', '#E74639', '#FBBC04', '#34A853'];
  const bgSymbols = ['{ }', '< >', '[ ]', ';;', 'if()', '=>', 'null', 'git'];

  function spawnSymbol(canvas) {
    const span = document.createElement('span');
    span.className = 'code-symbol';
    span.innerText = bgSymbols[Math.floor(Math.random() * bgSymbols.length)];
    span.style.color = bgColors[Math.floor(Math.random() * bgColors.length)];
    span.style.left = Math.random() * 100 + 'vw';
    span.style.animationDuration = (Math.random() * 8 + 12) + 's';
    span.style.animationDelay = -(Math.random() * 20) + 's';
    canvas.appendChild(span);
  }

  const bgTop    = document.getElementById('bg-canvas-top');
  const bgBottom = document.getElementById('bg-canvas-bottom');
  for (let i = 0; i < 14; i++) spawnSymbol(bgTop);
  for (let i = 0; i < 5;  i++) spawnSymbol(bgBottom);

  // Easter egg: Konami code
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let konamiIdx = 0;
  let partyActive = false;

  document.addEventListener('keydown', (e) => {
    if (e.key === KONAMI[konamiIdx]) {
      konamiIdx++;
      if (konamiIdx === KONAMI.length) {
        activatePartyMode();
        konamiIdx = 0;
      }
    } else {
      konamiIdx = (e.key === KONAMI[0]) ? 1 : 0;
    }
  });

  function activatePartyMode() {
    if (partyActive) return;
    partyActive = true;
    document.body.classList.add('party');
    showToast('🎉 easter egg odkryty');
    setTimeout(() => {
      document.body.classList.remove('party');
      partyActive = false;
    }, 5000);
  }
</script>
</body>
</html>
