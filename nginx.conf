server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML, CSS i JS bez cache: zmiana po pushu widoczna od razu.
    # Samo no-cache Cloudflare nadpisuje na max-age=14400, private zostawia.
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "private, no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
